<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Servicios | Iglesia Lluvia Tardía</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="icons/fontawesome-free-7.1.0-web/css/all.css">
</head>
<body>
    <header class="site-header">
        <div class="container header-inner">
            <div class="brand">
                <img src="img/LogoIglesia.png" alt="Logo Iglesia" class="brand-img">
            </div>
            <nav class="nav" id="nav">
                <button id="closeBtn" class="close-btn" aria-label="Cerrar menú">✕</button>
                <a href="index.html">Inicio</a>
                <a href="sobre-nosotros.html">Sobre Nosotros</a>
                <a href="servicios.html" aria-current="page">Servicios</a>
                <a href="anuncios.html">Anuncios</a>
                <a href="eventos.html">Eventos</a>
                <a href="equipos.html">Equipos</a>
                <a href="devocional.html">Devocional</a>
                <a href="contacto.html">Contacto</a>
            </nav>

            <div class="menu-toggle" id="menuToggle">
                <button id="menuBtn" class="menu-btn" aria-label="Abrir menú" aria-expanded="false">☰</button>
                <span class="menu-text">Menú</span>
            </div>
        </div>
    </header>

    <div id="menu-overlay" class="menu-overlay"></div>

    <main>
        <section id="servicios" class="servicios page-section is-visible">
            <div class="container servicios-content">
                <h2>Servicios</h2>
                <p>Consulta nuestros horarios de las reuniones semanales.</p>
                <div class="servicios-gallery">
                    <figure class="servicios-item">
                        <img src="img/ServiciosJue.jpg" alt="Servicio Jueves 7:00 PM">
                        <span class="servicios-caption">
                            <span class="servicios-caption-title">Servicio Jueves</span>
                            <span class="servicios-caption-time">7:00 PM</span>
                        </span>
                    </figure>
                    <figure class="servicios-item">
                        <img src="img/ServiciosDom.jpg" alt="Servicio Domingo 11:00 AM">
                        <span class="servicios-caption">
                            <span class="servicios-caption-title">Servicio Domingo</span>
                            <span class="servicios-caption-time">11:00 AM</span>
                            <span class="servicios-caption-time">& 6:00 PM</span>
                        </span>
                    </figure>
                    <figure class="servicios-item">
                        <img src="img/ServOracion.jpg" alt="Oración 9:00 AM">
                        <span class="servicios-caption">
                            <span class="servicios-caption-title">Oración</span>
                            <span class="servicios-caption-time">
                                <span class="servicios-caption-time-line servicios-caption-time-line-tight">Lunes a Viernes</span>
                                <span class="servicios-caption-time-line servicios-caption-time-line-tight">& Domingo</span>
                                <span class="servicios-caption-time-line">9:00 AM</span>
                            </span>
                        </span>
                    </figure>
                    <figure class="servicios-item">
                        <img src="img/ServiciosJov.jpg" alt="Servicio Jóvenes Sábado 5:00 PM">
                        <span class="servicios-caption">
                            <span class="servicios-caption-title">Servicio Jóvenes</span>
                            <span class="servicios-caption-time">
                                <span class="servicios-caption-time-line">Sábado</span>
                                <span class="servicios-caption-time-line">5:00 PM</span>
                            </span>
                        </span>
                    </figure>
                </div>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
