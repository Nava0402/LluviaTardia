<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eventos | Lluvia Tardía</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="icons/fontawesome-free-7.1.0-web/css/all.css">
</head>
<body>
    <header class="site-header">
        <div class="container header-inner">
            <div class="brand">
                <a href="index.html" class="brand-link">
                    <img src="img/LogoIglesia.png" alt="Logo Iglesia" class="brand-img">
                </a>
            </div>
            <nav class="nav" id="nav">
                <button id="closeBtn" class="close-btn" aria-label="Cerrar menú">✕</button>
                <a href="index.html">Inicio</a>
                <a href="sobre-nosotros.html">Sobre Nosotros</a>
                <a href="servicios.html">Servicios</a>
                <a href="anuncios.html">Anuncios</a>
                <a href="eventos.html" aria-current="page">Eventos</a>
                <a href="equipos.html">Equipos</a>
                <a href="devocional.html">Devocional</a>
                <a href="contacto.html">Contacto</a>
            </nav>

            <div class="menu-toggle" id="menuToggle">
                <button id="menuBtn" class="menu-btn" aria-label="Abrir menú" aria-expanded="false">☰</button>
            </div>
        </div>
    </header>

    <div id="menu-overlay" class="menu-overlay"></div>

    <main>
        <section id="eventos" class="page-section">
            <div class="container servicios-content">
                <h2>Eventos</h2>
                <p>Mira recuerdos de los eventos que hemos vivido en casa.</p>
            </div>

            <div class="container eventos-collage-wrap">
                <h3 class="eventos-collage-title">Bryan Caro "Transformación"</h3>
                <button class="eventos-collage" type="button" data-gallery="bryanc" aria-label="Abrir galería de Bryan Caro">
                    <img class="eventos-cover" src="img/BryanC1.jpg" alt="Portada del evento Bryan Caro">
                    <div class="eventos-thumbs" aria-hidden="true">
                        <img src="img/BryanC2.jpg" alt="">
                        <img src="img/BryanC3.jpg" alt="">
                        <img src="img/BryanC4.jpg" alt="">
                        <img src="img/BryanC5.jpg" alt="">
                    </div>
                    <span class="eventos-collage-label">Ver galería</span>
                </button>
            </div>

            <div class="container eventos-collage-wrap">
                <h3 class="eventos-collage-title">Fiesta de Primicias 2026</h3>
                <button class="eventos-collage" type="button" data-gallery="prim" aria-label="Abrir galería de Fiesta de Primicias 2026">
                    <img class="eventos-cover" src="img/Prim1.jpg" alt="Portada del evento Fiesta de Primicias 2026">
                    <div class="eventos-thumbs" aria-hidden="true">
                        <img src="img/Prim2.jpg" alt="">
                        <img src="img/Prim3.jpg" alt="">
                        <img src="img/Prim4.jpg" alt="">
                        <img src="img/Prim5.jpg" alt="">
                    </div>
                    <span class="eventos-collage-label">Ver galería</span>
                </button>
            </div>

            <div class="container eventos-collage-wrap">
                <h3 class="eventos-collage-title">Profeta Carlos García</h3>
                <button class="eventos-collage" type="button" data-gallery="carlosg" aria-label="Abrir galería de Carlos García">
                    <img class="eventos-cover" src="img/CarlosG1.jpg" alt="Portada del evento Carlos García">
                    <div class="eventos-thumbs" aria-hidden="true">
                        <img src="img/CarlosG2.jpg" alt="">
                        <img src="img/CarlosG3.jpg" alt="">
                        <img src="img/CarlosG4.jpg" alt="">
                        <img src="img/CarlosG5.jpg" alt="">
                    </div>
                    <span class="eventos-collage-label">Ver galería</span>
                </button>
            </div>

            <div class="eventos-modal" id="eventosModal" aria-hidden="true">
                <button class="eventos-modal-close" type="button" id="eventosModalClose" aria-label="Cerrar galería">✕</button>
                <figure class="eventos-modal-frame">
                    <img id="eventosModalImg" src="img/BryanC1.jpg" alt="Foto del evento">
                    <div class="eventos-modal-dots" id="eventosModalDots" aria-hidden="true"></div>
                </figure>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
