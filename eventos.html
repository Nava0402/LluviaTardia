<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eventos | Iglesia Lluvia Tardía</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="icons/fontawesome-free-7.1.0-web/css/all.css">
</head>
<body>
    <header class="site-header">
        <div class="container header-inner">
            <div class="brand">
                <img src="img/IMG-20251217-WA0010.jpg" alt="Logo Iglesia" class="brand-img">
                <div class="brand-text">
                    <span class="brand-line1">Ministerios</span>
                    <span class="brand-line2">Lluvia Tardía</span>
                </div>
            </div>
            <nav class="nav" id="nav">
                <button id="closeBtn" class="close-btn" aria-label="Cerrar menú">✕</button>
                <a href="index.html">Inicio</a>
                <a href="sobre-nosotros.html">Sobre Nosotros</a>
                <a href="servicios.html">Servicios</a>
                <a href="anuncios.html">Anuncios</a>
                <a href="eventos.html" aria-current="page">Eventos</a>
                <a href="equipos.html">Equipos</a>
                <a href="devocional.html">Devocional</a>
                <a href="contacto.html">Contacto</a>
            </nav>

            <div class="menu-toggle" id="menuToggle">
                <button id="menuBtn" class="menu-btn" aria-label="Abrir menú" aria-expanded="false">☰</button>
                <span class="menu-text">Menú</span>
            </div>
        </div>
    </header>

    <div id="menu-overlay" class="menu-overlay"></div>

    <main>
        <section id="eventos" class="page-section">
            <div class="container servicios-content">
                <h2>Eventos</h2>
                <p>Mira recuerdos de los eventos que hemos vivido en casa.</p>
            </div>

            <div class="container eventos-slider-wrap">
            <div class="eventos-slider" id="eventosSlider" aria-label="Galería Bryan Caro Transformación">
                <button class="eventos-slider-nav prev" type="button" id="eventosPrev" aria-label="Imagen anterior">❮</button>
                <figure class="eventos-slider-frame" id="eventosSliderFrame">
                    <img id="eventosSliderImg" src="img/BryanC1.jpg" alt="Foto del evento">
                    <figcaption class="eventos-slider-overlay">
                        <h4 id="eventosSliderTitle">Bryan Caro "Transformación"</h4>
                    </figcaption>
                    <div class="eventos-slider-dots" id="eventosSliderDots" aria-hidden="true"></div>
                </figure>
                <button class="eventos-slider-nav next" type="button" id="eventosNext" aria-label="Imagen siguiente">❯</button>
            </div>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
