<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="icons/fontawesome-free-7.1.0-web/css/all.css">
</head>
<body>
    <header class="site-header">
        <div class="container header-inner">
            <div class="brand">
                <a href="index.html" class="brand-link">
                    <img src="img/LogoIglesia.png" alt="Logo Iglesia" class="brand-img">
                </a>
            </div>
            <nav class="nav" id="nav">
                <button id="closeBtn" class="close-btn" aria-label="Cerrar menú">✕</button>
                <a href="index.html">Inicio</a>
                <a href="sobre-nosotros.html">Sobre Nosotros</a>
                <a href="servicios.html">Servicios</a>
                <a href="anuncios.html" aria-current="page">Anuncios</a>
                <a href="eventos.html">Eventos</a>
                <a href="equipos.html">Equipos</a>
                <a href="devocional.html">Devocional</a>
                <a href="contacto.html">Contacto</a>
            </nav>

            <div class="menu-toggle" id="menuToggle">
                <button id="menuBtn" class="menu-btn" aria-label="Abrir menú" aria-expanded="false">☰</button>
            </div>
        </div>
    </header>

    <div id="menu-overlay" class="menu-overlay"></div>

    <main>
<section id="anuncios" class="page-section">
    <div class="container servicios-content">
        <h2>Anuncios</h2>
        <p>Aquí puedes ver los anuncios de nuestros próximos eventos.</p>
    </div>

<div class="container anuncios-month-select-wrap">
        <label for="anunciosMonthSelect" class="anuncios-month-label">Selecciona un mes</label>
        <select id="anunciosMonthSelect" class="anuncios-month-select">
            <option value="" selected>Ninguno</option>
            <option value="enero">Enero</option>
            <option value="febrero">Febrero</option>
            <option value="marzo">Marzo</option>
            <option value="abril">Abril</option>
            <option value="mayo">Mayo</option>
            <option value="junio">Junio</option>
            <option value="julio">Julio</option>
            <option value="agosto">Agosto</option>
            <option value="septiembre">Septiembre</option>
            <option value="octubre">Octubre</option>
            <option value="noviembre">Noviembre</option>
            <option value="diciembre">Diciembre</option>
        </select>
    </div>
    <div class="container eventos-collage-wrap anuncios-month-block" id="anunciosMonthBlock" hidden>
        <h3 class="eventos-collage-title" id="anunciosMonthTitle">Eventos del mes</h3>
        <button class="eventos-collage" type="button" data-gallery="anuncios" aria-label="Abrir galería de anuncios del mes">
            <img class="eventos-cover" src="" alt="Anuncio principal del mes">
            <div class="eventos-thumbs eventos-thumbs-two" aria-hidden="true">
                <img src="" alt="">
                <img src="" alt="">
            </div>
            <span class="eventos-collage-label">Ver galería</span>
        </button>
        <p class="anuncios-empty-message" id="anunciosEmptyMessage" hidden>Aún no hay anuncios publicados para este mes.</p>
    </div>

    <div class="eventos-modal" id="eventosModal" aria-hidden="true">
        <button class="eventos-modal-close" type="button" id="eventosModalClose" aria-label="Cerrar galería">✕</button>
        <figure class="eventos-modal-frame">
            <img id="eventosModalImg" src="" alt="Foto del anuncio">
            <div class="eventos-modal-dots" id="eventosModalDots" aria-hidden="true"></div>
        </figure>
    </div>
</section>
    </main>

    <script src="script.js"></script>
</body>
</html>
